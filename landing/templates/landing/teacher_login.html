{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Teacher Login | E-SKWELA</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/green-theme.css' %}">
    <style>
        :root {
            --forest-green: #228B22;
            --emerald: #10B981;
            --sage: #4A7043;
            --mint-bg: #F0F9F0;
            --charcoal: #2F3E2F;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, var(--mint-bg) 0%, #e8f5e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', system-ui, sans-serif;
            padding: 20px;
        }

        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(34, 139, 34, 0.15);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, var(--forest-green), var(--emerald));
            color: white;
            padding: 45px 30px;
            text-align: center;
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -1.5px;
            margin-bottom: 6px;
        }

        .login-header p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .login-body {
            padding: 40px 35px;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--forest-green);
        }

        .input-wrapper {
            position: relative;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            border: 2px solid #e0e7e0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: #f8fcf8;
        }

        input:focus {
            border-color: var(--emerald);
            outline: none;
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.15);
        }

        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--emerald);
            font-size: 1.25rem;
        }

        .toggle-password {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: var(--sage);
            font-size: 1.2rem;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, var(--forest-green), var(--emerald));
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.4s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(34, 139, 34, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
        }

        .back-link a {
            color: var(--forest-green);
            text-decoration: none;
            font-weight: 500;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .alert-success {
            background: #e6f5ea;
            color: var(--forest-green);
        }

        .alert-error {
            background: #fff0f0;
            color: #dc3545;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo-title">E-SKWELA</div>
            <p>Teacher Portal</p>
        </div>

        <div class="login-body">
            {% if messages %}
            <div class="messages">
                {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    <i
                        class="fas fa-{% if message.tags == 'error' %}exclamation-circle{% else %}check-circle{% endif %}"></i>
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'teacher_login' %}">
                {% csrf_token %}
                <div class="form-group">
                    <label>Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" name="username" required placeholder="Enter your username"
                            value="{{ request.POST.username }}">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" name="password" id="password" required placeholder="Enter your password">
                        <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                    </div>
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>

            <div class="back-link">
                <a href="{% url 'home' %}"><i class="fas fa-arrow-left"></i> Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        // Toggle Password
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pw = document.getElementById('password');
            const type = pw.getAttribute('type') === 'password' ? 'text' : 'password';
            pw.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Loading State
        document.querySelector('form').addEventListener('submit', function () {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Logging in...`;
            btn.disabled = true;
        });
    </script>
</body>

</html>
